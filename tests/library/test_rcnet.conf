# test_rcnet.conf -- configuration for test_rcnet unit tests

selector ipany_src {
    direction outbound;
    src IP_ANY port any;
    dst IP_ANY port any;
    upper_layer_protocol "udp";
};

selector concrete_src {
    direction outbound;
    src "192.0.2.0/24" port any;
    dst "192.0.2.1/32" port any;
    upper_layer_protocol "udp";
};