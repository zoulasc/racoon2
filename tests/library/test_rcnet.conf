# Test configuration for lib/test_rcnet.c (TODO item 8: IP_ANY/IP_RW).
#
# IP_ANY is the wildcard macro: it has to be recognised as "any address"
# (rcs_is_addr_any()), and expanding it must yield both address families.

selector ipany_src {
	direction outbound;
	src IP_ANY;
	dst IP_ANY;
	policy_index p1;
};

selector concrete_src {
	direction outbound;
	src 192.0.2.0/24;
	dst 2001:db8::/32;
	policy_index p1;
};

policy p1 {
	action auto_ipsec;
};
